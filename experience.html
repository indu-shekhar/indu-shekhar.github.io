<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Scrolling Website</title>
    <link rel="stylesheet" href="exp_styles.css">
</head>

<body>
    <header>
        <div id="logo">Dark CSS</div>

        <div class="menu">
            <a href="" class="active">Home</a>
            <a href="">Blog</a>
            <a href="">About</a>
            <a href="">Contact</a>
        </div>
    </header>

    <div class="parallax">
        <h2 id="heading">Projects</h2>
        <!-- <img src="exp_image/background.jpg" alt="" id="background"> -->
        <img src="exp_image/moon.png" alt="" id="moon">
        <img src="exp_image/layer.png" alt="" id="mountain">
        <img src="exp_image/grass.png" alt="" id="grass">
    </div>

    <section>
        <div class="projects">
            <div class="card">
                <img src="exp_image/project1.jpg" alt="Project 1">
                <div class="card-content">
                    <h3>Project 1</h3>
                    <p>Details about Project 1.</p>
                </div>
            </div>
            <div class="card">
                <img src="exp_image/project2.jpg" alt="Project 2">
                <div class="card-content">
                    <h3>Project 2</h3>
                    <p>Details about Project 2.</p>
                </div>
            </div>
            <div class="card">
                <img src="exp_image/project3.jpg" alt="Project 3">
                <div class="card-content">
                    <h3>Project 3</h3>
                    <p>Details about Project 3.</p>
                </div>
            </div>
        </div>
    </section>

    <script>
        const heading = document.getElementById("heading");
        const moon = document.getElementById("moon");

        window.addEventListener("scroll", () => {
            let value = window.scrollY;

            if (value <= 500) {
                heading.style.marginTop = value * 2.5 + 'px';
                moon.style.right = 20 + value * 0.1 + '%';
            }
        });
    </script>
</body>

</html>
