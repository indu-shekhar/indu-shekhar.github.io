      <h2 id="heading">Projects</h2>
      <!-- <img src="exp_image/background.jpg" alt="" id="background"> -->
      <img src="exp_image/moon.png" alt="" id="moon" />
      <img src="exp_image/layer.png" alt="" id="mountain" />
      <img src="exp_image/grass.png" alt="" id="grass" />
    </div>

    <section id="cards">
      <div
        id="carouselExampleIndicators"
        class="carousel slide"
        data-ride="carousel"
      >
        <ol class="carousel-indicators">
          <li
            data-target="#carouselExampleIndicators"
            data-slide-to="0"
            class="active"
          ></li>
          <li data-target="#carouselExampleIndicators" data-slide-to="1"></li>
          <li data-target="#carouselExampleIndicators" data-slide-to="2"></li>
        </ol>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img
              class="d-block w-100"
              src="assets/project-1.png"
              alt="First slide"
            />
            <div class="carousel-caption d-none d-md-block">
              <h5>Project 1</h5>
              <p>Details about Project 1.</p>
            </div>
          </div>
          <div class="carousel-item">
            <img
              class="d-block w-100"
              src="assets/project-2.png"
              alt="Second slide"
            />
            <div class="carousel-caption d-none d-md-block">
              <h5>Project 2</h5>
              <p>Details about Project 2.</p>
            </div>
          </div>
          <div class="carousel-item">
            <img
              class="d-block w-100"
              src="assets/project-3.png"
              alt="Third slide"
            />
            <div class="carousel-caption d-none d-md-block">
              <h5>Project 3</h5>
              <p>Details about Project 3.</p>
            </div>
          </div>
          <a
            class="carousel-control-prev"
            href="#carouselExampleIndicators"
            role="button"
            data-slide="prev"
          >
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="sr-only">Previous</span>
          </a>
          <a
            class="carousel-control-next"
            href="#carouselExampleIndicators"
            role="button"
            data-slide="next"
          >
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="sr-only">Next</span>
          </a>
        </div>
      </div>
    </section>
    <section id="details">
      <div class="detail container">
        <div class="image-container">
          <img src="exp_image/project1.jpg" alt="Project 1" />
          <img src="exp_image/project2.jpg" alt="Project 2" />
          <img src="exp_image/project3.jpg" alt="Project 3" />
          <button id="prevBtn">Previous</button>
          <button id="nextBtn">Next</button>
        </div>
        <div class="text-container">
          <h2>Project 1</h2>
          <p></p>
          <button id="project_view_link">live</button>
          <button id="read_more">read more</button>
        </div>
      </div>
    </section>
  </body>
